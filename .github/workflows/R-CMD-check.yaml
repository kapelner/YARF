name: R-CMD-check

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: YARF
          extra-packages: |
            any::rcmdcheck
            local::../YARFJARs
          needs: check

      - name: Check YARFJARs
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: YARFJARs
          args: 'c("--no-manual")'
          error-on: 'error'
          artifact-name: YARFJARs-check

      - name: Check YARF
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: YARF
          args: 'c("--no-manual")'
          error-on: 'error'
          artifact-name: YARF-check
