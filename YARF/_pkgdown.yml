url: https://kapelner.github.io/YARF/

template:
  bootstrap: 5
  math-rendering: mathjax

home:
  title: YARF — Yet Another Random Forests Package
  description: >
    A customizable, asynchronous, and parallelized random forest implementation
    for R with user-defined JavaScript splitting and aggregation rules,
    missingness incorporated in attributes, imputation, variable importance,
    interaction analysis, and tree inspection.

navbar:
  structure:
    left: [intro, reference, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/kapelner/YARF
      aria-label: GitHub

